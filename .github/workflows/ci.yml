name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # rust-toolchain.toml pins the compiler and is already part of the key. Hashing every
          # toolchain the runner image happens to ship changes the key between image updates,
          # so the cache was never found.
          add-rust-environment-hash-key: false
      - name: Install ffmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache Topcoat CLI
        id: topcoat
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-${{ runner.os }}-${{ runner.arch }}-0.10.0-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install Topcoat CLI
        if: steps.topcoat.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.10.0 topcoat-cli
      - run: cargo fmt --all --check
      - run: topcoat fmt --check src
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
