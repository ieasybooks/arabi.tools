name: Container

# The release workflow builds the image before every deploy. Here it is only checked on pull
# requests that change packaging or browser assets, including the locally bundled PDF viewer.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - src/**/*.js
      - src/**/*.css
      - src/**/*.mjs
      - src/app/vendor/**
      - src/app/ocr/**
      - compose.yaml
      - deploy/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/container.yml
      - .github/scripts/diacritization-smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and check container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Compose configuration
        run: |
          mkdir -p "$RUNNER_TEMP/compose-check"
          printf 'ARLANG_TAG=0.1.0\nWIT_TOKENS_AR=ci-placeholder\nTUNNEL_TOKEN=ci-placeholder\n' > "$RUNNER_TEMP/compose-check/.env"
          docker compose -f compose.yaml --project-directory "$RUNNER_TEMP/compose-check" \
            --env-file "$RUNNER_TEMP/compose-check/.env" config --quiet
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: arlang-tools:ci
          cache-from: type=gha,scope=arlang-tools
          cache-to: type=gha,mode=max,scope=arlang-tools
      - name: Check health, media tools, and bundled assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wit"
          printf '[{"lang":"ar","is_app_for_token":true}]' > "$RUNNER_TEMP/wit/apps"
          python3 -m http.server 3999 --bind 127.0.0.1 --directory "$RUNNER_TEMP/wit" > "$RUNNER_TEMP/wit.log" 2>&1 &
          wit_pid=$!
          cleanup() {
            docker logs arlang-ci || true
            docker rm --force arlang-ci > /dev/null || true
            kill "$wit_pid" || true
          }
          trap cleanup EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3999/apps > /dev/null
          docker run --detach --name arlang-ci --network host \
            --env WIT_TOKENS_AR=ci-placeholder --env WIT_API_URL=http://127.0.0.1:3999 arlang-tools:ci
          for ((attempt = 0; attempt < 90; attempt++)); do
            health=$(docker inspect --format '{{.State.Health.Status}}' arlang-ci)
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$health" = healthy
          test "$(curl --fail --silent http://127.0.0.1:3000/health)" = ok
          docker exec arlang-ci sh -c 'test "$(id -u)" != 0 && ffmpeg -version > /dev/null && ffprobe -version > /dev/null'
          python3 - <<'PY'
          import re
          import subprocess
          import tomllib
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:3000"
          assets = set()
          for route in ("/", "/transcribe", "/ocr"):
              for language, direction in (("ar", "rtl"), ("en", "ltr")):
                  request = Request(base + route, headers={"Cookie": f"lang={language}"})
                  with urlopen(request, timeout=10) as response:
                      html = response.read().decode()
                  assert f'lang="{language}"' in html and f'dir="{direction}"' in html
                  assets.update(re.findall(r'(?:href|src)="(/[^"?]+\.(?:css|js))"', html))
          assert any(asset.endswith(".css") for asset in assets), "missing styles"
          assert any(asset.endswith(".js") for asset in assets), "missing scripts"
          manifest = tomllib.loads(subprocess.check_output(
              ["docker", "exec", "arlang-ci", "cat", "/app/assets/manifest.toml"], text=True))
          entries = manifest["assets"]
          for stem, extension in (("ocr-review", "js"), ("pdf.min", "mjs"), ("pdf.worker.min", "mjs"),
                                  ("jbig2", "wasm"), ("openjpeg", "wasm")):
              matches = [entry for entry in entries if re.fullmatch(rf"{re.escape(stem)}-[0-9a-f]+\.{extension}", entry["file"])]
              assert len(matches) == 1, f"missing or duplicated PDF viewer asset: {stem}"
              entry = matches[0]
              if extension in ("js", "mjs"):
                  assert entry["content_type"] in ("application/javascript", "text/javascript")
              assets.add("/_topcoat/assets/" + entry["file"])
          # Absolute bundle URLs must also resolve when requested by a deep job page.
          for asset in assets:
              with urlopen(Request(base + asset, headers={"Referer": base + "/ocr/jobs/" + "0" * 32}), timeout=10) as response:
                  assert response.read(), f"empty asset: {asset}"
                  if asset.endswith((".js", ".mjs")):
                      assert response.headers.get_content_type() in ("application/javascript", "text/javascript")
          print("Arabic and English pages, OCR viewer, worker and image decoders are bundled and available.")
          PY
          python3 .github/scripts/diacritization-smoke.py
          docker stop --time 300 arlang-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' arlang-ci)" = 0
