[package]
name = "arlang-tools"
description = "Free Arabic language tools on the web, starting with audio transcription."
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ieasybooks/arlang.tools"
publish = false

[dependencies]
anyhow = "1.0.104"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tafrigh = "0.3.0"
tafrigh-wit = "0.3.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
topcoat = { version = "0.10.0", features = ["multipart"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "form", "json", "multipart"] }
test-assets = { path = "crates/test-assets" }
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# tract (Silero VAD) is numerically heavy; keep dev builds usable.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
